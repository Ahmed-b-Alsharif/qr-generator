<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecting…</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#070707; color:#f5f5f5; font:16px system-ui,sans-serif; text-align:center; padding:16px; }
  .spin { width:34px; height:34px; border:3px solid #2a2a2a; border-top-color:#16c060; border-radius:50%; animation:s .8s linear infinite; margin:0 auto 14px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { color:#ff3b3b; }
</style>
<script src="config.js"></script>
</head>
<body>
<div><div class="spin" id="spin"></div><div id="t">Redirecting…</div></div>
<script>
(async () => {
  const code = new URLSearchParams(location.search).get("c");
  const fail = (m) => { document.getElementById("spin").style.display = "none"; const t = document.getElementById("t"); t.textContent = m; t.className = "err"; };
  if (!code) return fail("This QR code is not valid.");

  async function load() {
    // Newest data straight from GitHub (instant after you change a link)...
    if (location.hostname.endsWith(".github.io")) {
      const owner = location.hostname.split(".")[0];
      const repo = location.pathname.split("/").filter(Boolean)[0];
      try {
        const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/links.json?t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" });
        if (r.ok) return await r.json();
      } catch {}
    }
    // ...or fall back to the file served by the site itself.
    const r = await fetch("links.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("load");
    return await r.json();
  }

  try {
    const data = await load();
    const entry = data[code];
    if (!entry) return fail("This QR code is no longer active.");
    const u = new URL(entry.url);
    if (!["http:", "https:"].includes(u.protocol)) return fail("This link is not valid.");
    // Count the scan (never delays the visitor for more than a moment, and never blocks the redirect).
    const cu = window.SCAN_COUNTER_URL;
    if (cu) {
      try {
        await Promise.race([
          fetch(cu.replace(/\/$/, "") + "/hit?c=" + encodeURIComponent(code), { mode: "no-cors", keepalive: true }),
          new Promise((res) => setTimeout(res, 800)),
        ]);
      } catch {}
    }
    location.replace(u.href);
  } catch { fail("Could not load this link. Please try again."); }
})();
</script>
</body>
</html>
